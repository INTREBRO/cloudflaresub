name = "cloudflaresub"
main = "src/worker.js"
compatibility_date = "2026-03-06"
workers_dev = false
keep_vars = true
routes = [{ pattern = "sub.internetsoul.top", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/sub/*"]

[[kv_namespaces]]
binding = "SUB_STORE"
id = "8d6b0ea09cb64213b4e78ba30183e046"
